{{- define "credentialsModal" -}}
<div id="credentialsModal" class="modal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title">License Credentials</h4>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div id="credentialsModalBody" class="modal-body"
        hx-get="/v1/licenses/{{ .ID }}/credentials"
        hx-trigger="show.bs.modal from:#credentialsModal"
        hx-swap="innerHTML"
      >
        <div class="text-center">
          <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
{{- end -}}
