{{- with .LicenseCredentials -}}
<div class="form-group">
  <label class="form-label">Client ID</label>
  <div class="input-group mb-3">
    <input type="text" class="form-control" value="{{ .ClientID }}" id="clientID" readonly>
    <button class="btn btn-outline-secondary" type="button" id="copyClientIDBtn">
      <i class="fe fe-copy"></i>
    </button>
  </div>
</div>
<div class="form-group">
  <label class="form-label">Client Secret</label>
  <div class="input-group mb-3">
    <input type="text" class="form-control" value="{{ .ClientSecret }}" id="clientSecret" readonly>
    <button class="btn btn-outline-secondary" type="button" id="copyClientSecretBtn">
      <i class="fe fe-copy"></i>
    </button>
  </div>
</div>
{{- else -}}
<div class="alert alert-danger">
  <i class="fe fe-alert-triangle"></i>
  <strong>Error:</strong> Could not load credentials.
</div>
{{- end -}}
