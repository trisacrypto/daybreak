<div class="row">
  <div class="col-12 col-lg-6 col-xl">
    <!-- Company Count Card -->
    <div class="card">
      <div class="card-body">
        <div class="row align-items-center gx-0">
          <div class="col">

            <!-- Title -->
            <h6 class="text-uppercase text-body-secondary mb-2">
              Companies
            </h6>

            <!-- Heading -->
            <span class="h2 mb-0">
              {{ comma .Companies }}
            </span>

          </div>
          <div class="col-auto">

            <!-- Icon -->
            <span class="h2 fe fe-briefcase text-body-secondary mb-0"></span>

          </div>
        </div> <!-- / .row -->
      </div>
    </div>

  </div>

  <div class="col-12 col-lg-6 col-xl">
    <!-- Contact Count Card -->
    <div class="card">
      <div class="card-body">
        <div class="row align-items-center gx-0">
          <div class="col">

            <!-- Title -->
            <h6 class="text-uppercase text-body-secondary mb-2">
              Contacts
            </h6>

            <!-- Heading -->
            <span class="h2 mb-0">
              {{ comma .Contacts }}
            </span>

          </div>
          <div class="col-auto">

            <!-- Icon -->
            <span class="h2 fe fe-at-sign text-body-secondary mb-0"></span>

          </div>
        </div> <!-- / .row -->
      </div>
    </div>
  </div>

  <div class="col-12 col-lg-6 col-xl">
    <!-- Country Count Card -->
    <div class="card">
      <div class="card-body">
        <div class="row align-items-center gx-0">
          <div class="col">

            <!-- Title -->
            <h6 class="text-uppercase text-body-secondary mb-2">
              Countries
            </h6>

            <!-- Heading -->
            <span class="h2 mb-0">
              {{ comma .Countries }}
            </span>

          </div>
          <div class="col-auto">

            <!-- Icon -->
            <span class="h2 fe fe-globe text-body-secondary mb-0"></span>

          </div>
        </div> <!-- / .row -->
      </div>
    </div>
  </div>

  <div class="col-12 col-lg-6 col-xl">
    <!-- License Count Card -->
    <div class="card">
      <div class="card-body">
        <div class="row align-items-center gx-0">
          <div class="col">

            <!-- Title -->
            <h6 class="text-uppercase text-body-secondary mb-2">
              Licenses
            </h6>

            <!-- Heading -->
            <span class="h2 mb-0">
              {{ comma .Licenses }}
            </span>

          </div>
          <div class="col-auto">

            <!-- Icon -->
            <span class="h2 fe fe-award text-body-secondary mb-0"></span>

          </div>
        </div> <!-- / .row -->
      </div>
    </div>
  </div>
</div>
