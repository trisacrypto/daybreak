{{ define "deleteLicenseModal" }}
<div id="deleteLicenseModal" class="modal modal-lg" tabindex="-1">
  <div class='modal-dialog'>
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title">Revoke License</h4>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="alert alert-light">
          Revoking a license key will stop users from accessing the Daybreak API.
        </div>
        <p class="px-3 text-danger"><strong>Are you sure you want to delete the following license?</strong></p>
        <dl class="row px-3">
          <dt class="col-5">License ID:</dt>
          <dd class="col-7" id="licenseID"></dd>
        </dl>
      </div>
      <div class="modal-footer">
        <button id="deleteBtn" type="button" class="btn btn-danger">Delete</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
{{ end }}
